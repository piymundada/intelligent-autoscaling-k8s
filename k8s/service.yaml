apiVersion: v1
kind: Service
metadata:
  name: spring-boot-app
  namespace: thesis
  labels:
    app: spring-boot-app
spec:
  selector:
    app: spring-boot-app
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  type: ClusterIP
---
# NodePort for local Minikube access during experiments
apiVersion: v1
kind: Service
metadata:
  name: spring-boot-app-nodeport
  namespace: thesis
spec:
  selector:
    app: spring-boot-app
  ports:
    - port: 8080
      targetPort: 8080
      nodePort: 30080
  type: NodePort
