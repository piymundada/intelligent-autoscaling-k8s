spring.application.name=spring-workload-simulator
server.port=8080

# Expose all Actuator endpoints including /actuator/prometheus
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true

# Enable JVM metric binders (GC, heap, threads, classes)
management.metrics.enable.jvm=true
management.metrics.enable.process=true
management.metrics.enable.system=true

# Tag all metrics with app name for Prometheus label filtering
management.metrics.tags.application=${spring.application.name}

# Enable histogram buckets for HTTP requests — required for p95/p99 quantile queries
# Bracket notation required in Spring Boot 3.2+
management.metrics.distribution.percentiles-histogram[http.server.requests]=true

# Publish client-side percentiles directly as gauges (shows as quantile label in Prometheus)
management.metrics.distribution.percentiles[http.server.requests]=0.5,0.95,0.99
