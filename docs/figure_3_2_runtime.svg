<svg viewBox="0 0 880 470" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t33 d33">
<title id="t33">Figure 3.2 predictive autoscaler runtime architecture</title>
<desc id="d33">Requests flow from the internet through ingress and service to the pod; Prometheus scrapes workload and JVM metrics and feeds the predictive autoscaler, whose LSTM forecast and JVM-pressure floor produce a replica calculation that is enacted through the Kubernetes control plane.</desc>
