<svg viewBox="0 0 640 620" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t451 d451">
<title id="t451">Figure 4.5.1 the offline forecasting-model pipeline</title>
<desc id="d451">A five-stage offline pipeline of ml/ scripts, from capacity calibration through metric collection, preprocessing, LSTM training, and JVM-floor backtesting, producing a trained model and scaler that are baked into the controller image. A separate model is retrained on EKS-collected data.</desc>
<defs>
<marker id="ar4" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 L7 3 L0 6 Z" fill="#7a7a74"/>
</marker>
</defs>
<rect x="0" y="0" width="640" height="620" fill="#ffffff"/>

<!-- Stage 1 -->
<rect x="140" y="28" width="390" height="64" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<circle cx="105" cy="60" r="15" fill="#378ADD"/>
<text x="105" y="65" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">1</text>
<text x="160" y="55" font-size="14" font-weight="600" fill="#1f1f1f">Calibrate capacity</text>
<text x="160" y="76" font-size="11" font-family="Menlo, Consolas, monospace" fill="#5F5E5A">calibrate_capacity.py</text>

<!-- Stage 2 -->
<rect x="140" y="118" width="390" height="64" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<circle cx="105" cy="150" r="15" fill="#378ADD"/>
<text x="105" y="155" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">2</text>
<text x="160" y="145" font-size="14" font-weight="600" fill="#1f1f1f">Collect and merge metrics</text>
<text x="160" y="166" font-size="11" font-family="Menlo, Consolas, monospace" fill="#5F5E5A">collect_metrics.py · merge_locust_prometheus.py</text>

<!-- Stage 3 -->
<rect x="140" y="208" width="390" height="64" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<circle cx="105" cy="240" r="15" fill="#378ADD"/>
<text x="105" y="245" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">3</text>
<text x="160" y="235" font-size="14" font-weight="600" fill="#1f1f1f">Preprocess and split</text>
<text x="160" y="256" font-size="11" font-family="Menlo, Consolas, monospace" fill="#5F5E5A">preprocess.py  (min–max scaling, time-ordered splits)</text>

<!-- Stage 4 -->
<rect x="140" y="298" width="390" height="64" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<circle cx="105" cy="330" r="15" fill="#378ADD"/>
<text x="105" y="335" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">4</text>
<text x="160" y="325" font-size="14" font-weight="600" fill="#1f1f1f">Train LSTM</text>
<text x="160" y="346" font-size="11" font-family="Menlo, Consolas, monospace" fill="#5F5E5A">train.py  (PyTorch, saves weights + scaler)</text>

<!-- Stage 5 -->
<rect x="140" y="388" width="390" height="64" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<circle cx="105" cy="420" r="15" fill="#378ADD"/>
<text x="105" y="425" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">5</text>
<text x="160" y="415" font-size="14" font-weight="600" fill="#1f1f1f">Backtest JVM floor</text>
<text x="160" y="436" font-size="11" font-family="Menlo, Consolas, monospace" fill="#5F5E5A">backtest_jvm_floor.py</text>

<!-- Output -->
<rect x="140" y="490" width="390" height="66" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="2"/>
<text x="335" y="517" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f1f1f">Trained model + scaler</text>
<text x="335" y="538" text-anchor="middle" font-size="12.5" fill="#5F5E5A">baked into the controller image</text>

<!-- flow arrows -->
<line x1="335" y1="92" x2="335" y2="116" stroke="#7a7a74" stroke-width="2" marker-end="url(#ar4)"/>
<line x1="335" y1="182" x2="335" y2="206" stroke="#7a7a74" stroke-width="2" marker-end="url(#ar4)"/>
<line x1="335" y1="272" x2="335" y2="296" stroke="#7a7a74" stroke-width="2" marker-end="url(#ar4)"/>
<line x1="335" y1="362" x2="335" y2="386" stroke="#7a7a74" stroke-width="2" marker-end="url(#ar4)"/>
<line x1="335" y1="452" x2="335" y2="488" stroke="#7a7a74" stroke-width="2" marker-end="url(#ar4)"/>

<text x="335" y="582" text-anchor="middle" font-size="11.5" font-style="italic" fill="#8A897F">A separate model is retrained on EKS-collected data.</text>
</svg>
