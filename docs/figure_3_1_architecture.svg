<title id="t31">Figure 3.1 system workflow and evaluation architecture</title>
<desc id="d31">Workload generation feeds the Spring Boot service on Kubernetes; three-layer metric collection feeds two autoscaling arms, the reactive HPA and the LSTM-based predictive autoscaler, which converge on evaluation.</desc>
