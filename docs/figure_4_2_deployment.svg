<svg viewBox="0 0 700 545" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif" role="img" aria-labelledby="t431 d431">
<title id="t431">Figure 4.3.1 deployment architecture</title>
<desc id="d431">Two container images are pulled from Amazon ECR into two isolated EKS clusters run in parallel: one hosting the Kubernetes HPA arm and one hosting the predictive-autoscaler arm. Each cluster runs its own Locust load generator, spring-workload-simulator application pods, and Prometheus, so latency and node attribution are free of shared-node interference.</desc>
<defs>
<marker id="arp" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto" markerUnits="userSpaceOnUse">
<path d="M0 0 L7 3 L0 6 Z" fill="#9a9992"/>
</marker>
</defs>
<rect x="0" y="0" width="700" height="545" fill="#ffffff"/>

<!-- Amazon ECR -->
<rect x="250" y="18" width="200" height="52" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="1.5"/>
<text x="350" y="42" text-anchor="middle" font-size="14.5" font-weight="600" fill="#1f1f1f">Amazon ECR</text>
<text x="350" y="60" text-anchor="middle" font-size="12" fill="#5F5E5A">container images</text>

<!-- image-pull arrows -->
<line x1="330" y1="70" x2="200" y2="114" stroke="#9a9992" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arp)"/>
<line x1="370" y1="70" x2="500" y2="114" stroke="#9a9992" stroke-width="1.5" stroke-dasharray="6 4" marker-end="url(#arp)"/>
<text x="350" y="96" text-anchor="middle" font-size="11" fill="#8A897F">image pull</text>

<!-- Cluster 1: HPA arm -->
<rect x="30" y="116" width="310" height="350" rx="10" fill="none" stroke="#9a9992" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="185" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f1f1f">EKS cluster 1 · HPA arm</text>

<rect x="55" y="150" width="260" height="54" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="70" y="173" font-size="13.5" font-weight="600" fill="#1f1f1f">Locust</text>
<text x="70" y="192" font-size="11.5" fill="#5F5E5A">in-cluster load generator</text>

<rect x="55" y="218" width="260" height="54" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="70" y="241" font-size="13.5" font-weight="600" fill="#1f1f1f">spring-workload-simulator</text>
<text x="70" y="260" font-size="11.5" fill="#5F5E5A">application pods (autoscaled)</text>

<rect x="55" y="286" width="260" height="54" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="70" y="309" font-size="13.5" font-weight="600" fill="#1f1f1f">Prometheus</text>
<text x="70" y="328" font-size="11.5" fill="#5F5E5A">metrics scraping and storage</text>

<rect x="55" y="354" width="260" height="54" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1.5"/>
<text x="70" y="377" font-size="13.5" font-weight="600" fill="#1f1f1f">Kubernetes HPA</text>
<text x="70" y="396" font-size="11.5" fill="#5F5E5A">CPU 60% / memory 70% targets</text>

<!-- Cluster 2: predictive arm -->
<rect x="360" y="116" width="310" height="350" rx="10" fill="none" stroke="#9a9992" stroke-width="1.5" stroke-dasharray="7 4"/>
<text x="515" y="138" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1f1f1f">EKS cluster 2 · predictive arm</text>

<rect x="385" y="150" width="260" height="54" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="400" y="173" font-size="13.5" font-weight="600" fill="#1f1f1f">Locust</text>
<text x="400" y="192" font-size="11.5" fill="#5F5E5A">in-cluster load generator</text>

<rect x="385" y="218" width="260" height="54" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="400" y="241" font-size="13.5" font-weight="600" fill="#1f1f1f">spring-workload-simulator</text>
<text x="400" y="260" font-size="11.5" fill="#5F5E5A">application pods (autoscaled)</text>

<rect x="385" y="286" width="260" height="54" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="1.5"/>
<text x="400" y="309" font-size="13.5" font-weight="600" fill="#1f1f1f">Prometheus</text>
<text x="400" y="328" font-size="11.5" fill="#5F5E5A">metrics scraping and storage</text>

<rect x="385" y="354" width="260" height="54" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="1.5"/>
<text x="400" y="377" font-size="13.5" font-weight="600" fill="#1f1f1f">Predictive autoscaler</text>
<text x="400" y="396" font-size="11.5" fill="#5F5E5A">LSTM + JVM floor, RBAC-scoped</text>

</svg>
