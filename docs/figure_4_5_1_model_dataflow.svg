   <g id="text_1">
    <text style="fill: #1f1f1f; font: 600 11.5px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="35.32462" transform="rotate(-0 44.75 35.32462)">Normalised metric window</text>
   </g>
   <g id="text_2">
    <text style="fill: #1f1f1f; font: 10px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="55.160261" transform="rotate(-0 44.75 55.160261)">(10 time steps × 10 features), each value scaled to 0 to 1</text>
   </g>
   <g id="text_3">
    <text style="fill: #5f5e5a; font: italic 9.2px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="70.004932" transform="rotate(-0 44.75 70.004932)">five minutes of history at 30 s sampling</text>
   </g>
   <g id="text_4">
    <text style="fill: #1f1f1f; font: 600 11.5px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="121.806314" transform="rotate(-0 44.75 121.806314)">nn.LSTM(batch_first=True)</text>
   </g>
   <g id="text_5">
    <text style="fill: #1f1f1f; font: 10px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="141.564182" transform="rotate(-0 44.75 141.564182)">1 layer × 16 units locally, 2 layers × 64 units on EKS</text>
   </g>
   <g id="text_6">
    <text style="fill: #5f5e5a; font: italic 9.2px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="156.399477" transform="rotate(-0 44.75 156.399477)">reads the window one step at a time, carrying state forward</text>
   </g>
   <g id="text_7">
    <text style="fill: #1f1f1f; font: 600 11.5px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="208.113711" transform="rotate(-0 44.75 208.113711)">Recurrent output, all steps</text>
   </g>
   <g id="text_8">
    <text style="fill: #1f1f1f; font: 10px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="227.927477" transform="rotate(-0 44.75 227.927477)">(batch, 10, hidden)</text>
   </g>
   <g id="text_9">
    <text style="fill: #5f5e5a; font: italic 9.2px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="242.817023" transform="rotate(-0 44.75 242.817023)">one hidden vector per input time step</text>
   </g>
   <g id="text_10">
    <text style="fill: #1f1f1f; font: 600 11.5px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="294.508256" transform="rotate(-0 44.75 294.508256)">lstm_out[:, -1, :]</text>
   </g>
   <g id="text_11">
    <text style="fill: #1f1f1f; font: 10px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="314.322023" transform="rotate(-0 44.75 314.322023)">(batch, hidden)</text>
   </g>
   <g id="text_12">
    <text style="fill: #5f5e5a; font: italic 9.2px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="329.220193" transform="rotate(-0 44.75 329.220193)">keep only the final step: the network's summary of the whole window</text>
   </g>
   <g id="text_13">
    <text style="fill: #1f1f1f; font: 600 11.5px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="380.970185" transform="rotate(-0 44.75 380.970185)">nn.Dropout(0.2)</text>
   </g>
   <g id="text_14">
    <text style="fill: #1f1f1f; font: 10px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="400.716568" transform="rotate(-0 44.75 400.716568)">(batch, hidden)</text>
   </g>
   <g id="text_15">
    <text style="fill: #5f5e5a; font: italic 9.2px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="415.583114" transform="rotate(-0 44.75 415.583114)">active in training only, disabled at inference</text>
   </g>
   <g id="text_16">
    <text style="fill: #1f1f1f; font: 600 11.5px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="467.36473" transform="rotate(-0 44.75 467.36473)">nn.Linear(hidden, 1) then squeeze(-1)</text>
   </g>
   <g id="text_17">
    <text style="fill: #1f1f1f; font: 10px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="487.111114" transform="rotate(-0 44.75 487.111114)">(batch,)</text>
   </g>
   <g id="text_18">
    <text style="fill: #5f5e5a; font: italic 9.2px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="502.000659" transform="rotate(-0 44.75 502.000659)">one number per window</text>
   </g>
   <g id="text_19">
    <text style="fill: #1f1f1f; font: 600 11.5px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="553.750291" transform="rotate(-0 44.75 553.750291)">Normalised request-rate forecast</text>
   </g>
   <g id="text_20">
    <text style="fill: #1f1f1f; font: 10px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="573.416597" transform="rotate(-0 44.75 573.416597)">a single value in 0 to 1, 60 s ahead</text>
   </g>
   <g id="text_21">
    <text style="fill: #5f5e5a; font: italic 9.2px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="588.395205" transform="rotate(-0 44.75 588.395205)">the model's output ends here</text>
   </g>
   <g id="text_22">
    <text style="fill: #1f1f1f; font: 600 11.5px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="640.086438" transform="rotate(-0 44.75 640.086438)">Denormalise with the saved scaler</text>
   </g>
   <g id="text_23">
    <text style="fill: #1f1f1f; font: 10px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="659.939267" transform="rotate(-0 44.75 659.939267)">RPS = value × (max − min) + min</text>
   </g>
   <g id="text_24">
    <text style="fill: #5f5e5a; font: italic 9.2px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="674.825687" transform="rotate(-0 44.75 674.825687)">converts the forecast to requests per second</text>
   </g>
   <g id="text_25">
    <text style="fill: #1f1f1f; font: 600 11.5px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="726.480984" transform="rotate(-0 44.75 726.480984)">Replica count</text>
   </g>
   <g id="text_26">
    <text style="fill: #1f1f1f; font: 10px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="746.355687" transform="rotate(-0 44.75 746.355687)">ceil(RPS ÷ sustainable RPS per replica × 1.5), clamped</text>
   </g>
   <g id="text_27">
    <text style="fill: #5f5e5a; font: italic 9.2px 'Helvetica', 'Arial', 'DejaVu Sans'; text-anchor: start" x="44.75" y="761.173514" transform="rotate(-0 44.75 761.173514)">the controller's forecast-based recommendation, before the JVM floor</text>
   </g>
  </g>
 </g>
